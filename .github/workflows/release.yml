# Builds the Windows exe and publishes it as GitHub release when a version tag is pushed,
# e.g. "git tag v2.5.0" + "git push origin v2.5.0".
# Uses only the automatic, short-lived GITHUB_TOKEN of the run (no personal token / secrets needed).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write  # needed to create the release and upload the zip

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build requirements
        run: python -m pip install -r build-exe/requirements-build.txt

      - name: Set version from tag
        run: python build-exe/set_version.py "$env:TAG"

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --workpath build --distpath dist build-exe/build.spec

      - name: Package
        run: |
          $asset = "MKV-Muxing-Batch-GUI-$env:TAG-Windows-x64.zip"
          Compress-Archive -Path "dist/MKV Muxing Batch GUI" -DestinationPath $asset
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:TAG" "$env:ASSET" --title "$env:TAG" --notes-file build-exe/release-notes.md --generate-notes
